# CI Pipeline - Build and Test
# This pipeline will be extended to the OneESPT template
resources:
  repositories:
  - repository: 1ESPipelineTemplates
    type: git
    name: 1ESPipelineTemplates/1ESPipelineTemplates
    ref: refs/tags/release
extends:
  template: v1/1ES.Official.PipelineTemplate.yml@1ESPipelineTemplates
  parameters:
    sdl:
      sourceAnalysisPool:
        name: Azure-Pipelines-1ESPT-ExDShared
        image: windows-2022
        os: windows
    pool:
      name: Azure-Pipelines-1ESPT-ExDShared
      image: ubuntu-latest
      os: linux
    stages:
    - stage: CI
      displayName: Build And Test
      jobs:
      - job: job
        strategy:
          matrix:
            'Node 20':
              versionSpec: '20.x'
              npmVersion: '10'

        steps:
        - task: NodeTool@0
          inputs:
            versionSpec: $(versionSpec)
          displayName: Install node
        - script: npm install -g npm@$(npmVersion)
          displayName: Upgrade npm
        - script: npm install
          displayName: npm install
        - script: npm run build
          displayName: npm run build
        - script: npm run units
          displayName: Run unit tests
        - task: Npm@1
          displayName: Publish azure-devops-node-api to kusto npm
          condition: and(succeeded(), in(variables['build.reason'], 'IndividualCI', 'BatchedCI', 'Manual'), eq(variables['build.sourcebranchname'], 'master'))
          inputs:
            command: publish
            workingDir: '_build'
            publishRegistry: useFeed
            publishFeed: tfs-cli
          continueOnError: true
